[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yinit"
version = "0.1.0"
description = "Python-based Init System"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "Mateusz Piwek" }
]

dependencies = []

[project.scripts]
yinit = "yinit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
